<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | ميس إسراء فرج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap'); body{font-family: 'Cairo', sans-serif;}</style>
</head>
<body class="bg-gray-50 pb-20">
    <nav class="bg-blue-900 text-white p-4 shadow-lg mb-8 flex justify-between items-center">
        <h1 class="text-xl font-bold">لوحة الإدارة الاحترافية</h1>
        <a href="/logout" class="bg-red-600 px-4 py-2 rounded-lg">خروج</a>
    </nav>

    <div class="max-w-5xl mx-auto p-4 space-y-10">
        <section class="bg-white rounded-3xl shadow p-6 border-t-8 border-blue-600">
            <h2 class="text-xl font-bold mb-4">إضافة كورس جديد (سعر 0 = مجاني)</h2>
            <form action="/add_course" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="title" placeholder="اسم الكورس" required class="p-4 border rounded-xl">
                <input type="number" name="price" placeholder="السعر (0 للمجاني)" required class="p-4 border rounded-xl">
                <input type="file" name="course_image" class="md:col-span-2">
                <button class="md:col-span-2 bg-blue-600 text-white p-4 rounded-xl font-bold">حفظ الكورس ✅</button>
            </form>
        </section>

        <section class="bg-white rounded-3xl shadow p-6 border-t-8 border-orange-500">
            <h2 class="text-xl font-bold mb-4">توليد أكواد الاشتراك</h2>
            <form action="/generate_codes" method="POST" class="flex gap-4 mb-6">
                <input type="number" name="count" placeholder="العدد" required class="p-4 border rounded-xl flex-1">
                <button class="bg-orange-600 text-white px-8 rounded-xl font-bold">توليد الآن</button>
            </form>
            
            <h3 class="font-bold text-gray-700 mb-2 italic text-sm">الأكواد المتاحة (انسخها للطلاب):</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 max-h-48 overflow-y-auto bg-gray-50 p-4 rounded-xl border">
                {% for c in codes %}
                <div class="bg-white border border-orange-200 p-2 rounded text-center font-mono font-bold text-orange-700 text-sm select-all">
                    {{ c.code }}
                </div>
                {% endfor %}
            </div>
        </section>

        <section class="bg-white rounded-3xl shadow p-6 border-t-8 border-green-600">
            <h2 class="text-xl font-bold mb-4">قائمة الطلاب</h2>
            <table class="w-full text-right border-collapse">
                <tr class="border-b text-gray-400 text-sm"><th class="p-2">الاسم</th><th class="p-2">الموبايل</th></tr>
                {% for s in students %}
                <tr class="border-b text-sm"><td class="p-2 font-bold">{{ s.full_name }}</td><td class="p-2">{{ s.username }}</td></tr>
                {% endfor %}
            </table>
        </section>
    </div>
</body>
</html>
