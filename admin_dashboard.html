<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ميس إسراء فرج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- شريط التنقل العلوي -->
    <nav class="bg-blue-900 text-white shadow-lg p-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="iconify" data-icon="solar:shield-user-bold"></span>
                لوحة إدارة المنصة
            </h1>
            <a href="/" class="bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-lg transition">العودة للرئيسية</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4 space-y-8">

        <!-- 1. قسم إدارة الكورسات -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-blue-50 p-4 border-b border-gray-200">
                <h2 class="text-xl font-bold text-blue-900 flex items-center gap-2">
                    <span class="iconify" data-icon="solar:book-bookmark-bold text-2xl"></span>
                    إضافة كورس جديد
                </h2>
            </div>
            <form action="/admin/add_course" method="POST" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">عنوان الكورس</label>
                    <input type="text" name="title" placeholder="مثال: كيمياء الصف الثالث الثانوي" required
                        class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">وصف الكورس</label>
                    <textarea name="description" rows="3" placeholder="اكتب نبذة مختصرة عن الكورس..."
                        class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    حفظ الكورس الجديد ✅
                </button>
            </form>
        </section>

        <!-- 2. قسم إضافة الدروس -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-purple-50 p-4 border-b border-gray-200">
                <h2 class="text-xl font-bold text-purple-900 flex items-center gap-2">
                    <span class="iconify" data-icon="solar:videocamera-record-bold text-2xl"></span>
                    إضافة درس لـكورس
                </h2>
            </div>
            <form action="/admin/add_lesson" method="POST" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اختر الكورس</label>
                    <select name="course_id" required class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="">-- حدد الكورس التابع له --</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">عنوان الدرس</label>
                        <input type="text" name="lesson_title" placeholder="مثال: مقدمة في الكيمياء العضوية" required
                            class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">رابط الفيديو (YouTube)</label>
                        <input type="text" name="video_url" placeholder="https://youtube.com/..." required
                            class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    رفع الدرس الآن 🎥
                </button>
            </form>
        </section>

    </div>
</body>
</html>
